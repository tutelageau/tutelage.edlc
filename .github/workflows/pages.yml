name: pages

# The public site, edlc.tutelage.au. Every pull request builds and checks it; every push to `main`
# builds, checks and publishes it to GitHub Pages. Fully static: Eleventy writes `_site/`, the
# check (`tooling/check.mjs`) refuses broken links, missing anchors and public-safety terms, and
# Pages serves the result. The custom domain is set in the repository's Pages settings
# (docs/site.md §First deploy); `site/CNAME` ships in the artifact to match it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve the Pages base path
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Build
        env:
          # `` on the custom domain, `/<repo>` on a project page; Eleventy wants a trailing slash.
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
        run: pnpm build
      - name: Check
        run: pnpm check
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: deploy to github pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
